; Compilacion reproducible en Mac con PlatformIO (no requiere GitHub).
; PLACA: M5Stack ATOMS3 Lite C124 (ESP32-S3, 8 MB flash).
; NOTA: v9.6 R4 no probada en hardware; no instalar sin validar BLE y rollback.
[env:atoms3_lite_c124]
platform = espressif32@6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.flash_mode = dio
board_build.partitions = partitions_8mb.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCIELO_VERSION="11.1.0-RC5-B1-SEGURIDAD"
lib_deps =
    adafruit/Adafruit NeoPixel@1.12.4
; Usa BLE incluida con Arduino-ESP32 2.x. No requiere NimBLE externo.
; PENDIENTE: verificar velocidad/config flash con esptool del backup original.
