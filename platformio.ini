; Compilacion reproducible en Mac con PlatformIO (no requiere GitHub).
; PLACA: M5Stack ATOMS3 Lite C124 (ESP32-S3, 8 MB flash).
; NOTA: RC5 B1-B9 no probada en hardware; no instalar sin validar BLE y rollback.
[env:atoms3_lite_c124]
platform = espressif32@6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.flash_mode = dio
board_build.partitions = partitions_8mb.csv
build_flags =
    -fstack-usage
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=0
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=0
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCIELO_VERSION="11.1.0-RC6-RECOVERY1"
lib_deps =
    adafruit/Adafruit NeoPixel@1.12.4
    h2zero/NimBLE-Arduino@2.3.6
; Transporte NimBLE fijado: conexion asincrona de 8 s, sin borrar tareas BT.
; PENDIENTE: verificar velocidad/config flash con esptool del backup original.
