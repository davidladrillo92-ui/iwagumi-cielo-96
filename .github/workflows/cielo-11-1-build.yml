name: CIELO 11.1 · Compilar y verificar
on:
  push:
    branches: [dev/cielo-11-1-ux-producto, dev/cielo-11-1-seguridad-ota-20261021, dev/cielo-11-1-rc3-auth-lan-20261021, dev/cielo-11-1-rc4-signed-tls-20261021, dev/cielo-11-1-rc5-b1-night-safety-20261021, dev/cielo-11-1-rc5-b1-b5-diagnostico-20261021, dev/cielo-11-1-rc5-b1-b5-b3-ota-security-20261021, dev/cielo-11-1-rc5-b1-b5-b3-b2-b4-curvas-20261021]
  workflow_dispatch:
jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verificar código y perfiles
        run: |
          python tools/validar_fuentes.py
          pip install cryptography==46.0.4
          python tools/test_security_crypto.py
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/test_night_safety.cpp -o /tmp/test_night_safety
          /tmp/test_night_safety
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/test_b1_scenarios.cpp -o /tmp/test_b1_scenarios
          /tmp/test_b1_scenarios
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/test_b5_diagnostics.cpp -o /tmp/test_b5_diagnostics
          /tmp/test_b5_diagnostics
          python tests/test_b5_source_contract.py
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/test_b3_security_policy.cpp -o /tmp/test_b3_security
          /tmp/test_b3_security
          python tests/test_b3_contract.py
          python -c "from pathlib import Path; h=Path('web/interfaz_r4.html').read_text(); Path('/tmp/cielo_ui_test.js').write_text(h.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/cielo_ui_test.js
          node tests/test_b3_browser_live.js
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/test_b2b4_curves.cpp -o /tmp/test_b2b4_curves
          /tmp/test_b2b4_curves
          node tests/test_b2b4_editor.js
          python tests/test_b2b4_contract.py
      - name: Instalar PlatformIO
        run: pip install platformio==6.1.18
      - name: Compilar ATOMS3 Lite
        run: pio run -e atoms3_lite_c124
      - name: Comprobar tamaño
        run: test -s .pio/build/atoms3_lite_c124/firmware.bin
      - name: Preparar archivo y huella
        run: |
          mkdir -p dist
          cp .pio/build/atoms3_lite_c124/firmware.bin dist/CIELO_11_1_CANDIDATO_SOLO_APLICACION.bin
          sha256sum dist/CIELO_11_1_CANDIDATO_SOLO_APLICACION.bin > dist/SHA256.txt
          cp partitions_8mb.csv dist/partitions_8mb.csv
          git archive --format=zip --output=dist/CIELO_11_1_FUENTES_COMPLETAS.zip HEAD
          sha256sum dist/CIELO_11_1_FUENTES_COMPLETAS.zip >> dist/SHA256.txt
          printf '%s\n' "ATOMS3 Lite C124, fuente GitHub HEAD, firmware SOLO APLICACION, NO FLASHEAR SIN VALIDACION FISICA" > dist/LEEME_RECUPERACION.txt
      - name: Publicar BIN candidato
        uses: actions/upload-artifact@v4
        with:
          name: CIELO_11_1_CANDIDATO_NO_INSTALAR_SIN_PRUEBAS
          path: dist/
          if-no-files-found: error
