name: CIELO 11.1 · Compilar y verificar
on:
  push:
    branches: [dev/cielo-11-1-ux-producto, dev/cielo-11-1-seguridad-ota-20261021, dev/cielo-11-1-rc3-auth-lan-20261021, dev/cielo-11-1-rc4-signed-tls-20261021, dev/cielo-11-1-rc5-b1-night-safety-20261021, dev/cielo-11-1-rc5-b1-b5-diagnostico-20261021, dev/cielo-11-1-rc5-b1-b5-b3-ota-security-20261021, dev/cielo-11-1-rc5-b1-b5-b3-b2-b4-curvas-20261021, dev/cielo-11-1-rc5-b1-b5-b3-b2-b4-b6-b7-ui-20261021, dev/cielo-11-1-rc5-b8-b9-monitor-mantenimiento-20261021, dev/cielo-11-1-rc6-recovery1-20261023, dev/cielo-rc5-recovery3-20261025, dev/cielo-recovery3-1-bloqueos-clasificados-20261025, dev/cielo-recovery3-1-selective-ch-20261025, dev/cielo-recovery3-1-pv-diagnostics-20261025, dev/cielo-rc5-recovery3-1-integrada-20261025, dev/cielo-rc5-3-2-app-stability-20261026, dev/cielo-rc5-3-3-persistent-ble-safety-20261026, dev/cielo-rc5-3-4-consolidacion-cinco-puntos-20261026, dev/cielo-rc5-recovery3-5-spiffs-curvas-seguras-20261026, dev/cielo-rc5-recovery3-5-1-fs-guard-20261026, dev/cielo-rc5-recovery3-5-2-nvs-recovery-20261026, dev/cielo-rc5-recovery3-6-maintenance-20261026]
  pull_request:
    branches: [dev/cielo-11-1-rc5-b1-b5-b3-b2-b4-b6-b7-ui-20261021, dev/cielo-11-1-rc5-b8-b9-monitor-mantenimiento-20261021, dev/cielo-11-1-rc6-recovery1-20261023, dev/cielo-rc5-recovery3-5-spiffs-curvas-seguras-20261026, dev/cielo-rc5-recovery3-5-1-fs-guard-20261026, dev/cielo-rc5-recovery3-5-2-nvs-recovery-20261026]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cielo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sierra_python39:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Probar instalador Sierra V3 a V4 con Python 3.9
        run: python tests/test_sierra_observer.py
      - name: Empaquetar instalador Sierra
        run: python tools/package_sierra.py
      - uses: actions/upload-artifact@v4
        with:
          name: CIELO_VIGILANCIA_iMAC_SIERRA_V4_0_1
          path: dist/CIELO_VIGILANCIA_iMAC_SIERRA_V4_0_1.zip
          if-no-files-found: error
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verificar código y perfiles
        run: |
          pip install cryptography==46.0.4 paho-mqtt==2.1.0
          python tools/check_b89.py
      - name: Probar clasificador BLE independiente
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_ble_blockage.cpp -o /tmp/cielo_ble_blockage_test
          /tmp/cielo_ble_blockage_test
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_ble_selective.cpp -o /tmp/cielo_ble_selective_test
          /tmp/cielo_ble_selective_test
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_recovery_scenarios.cpp -o /tmp/cielo_recovery_scenarios_test
          /tmp/cielo_recovery_scenarios_test
      - name: Probar RECOVERY3.4 NVS, RAM y recuperacion
        run: |
          python tests/test_rc5_3_4_diagnostics.py
          python tests/test_rc5_3_4_recovery_policy.py
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_rc5_3_4_nvs_safe.cpp -o /tmp/cielo_nvs_safe_test
          /tmp/cielo_nvs_safe_test
      - name: Probar RECOVERY3.5 almacenamiento y recuperación ante errores
        run: |
          python tests/test_rc5_3_5_integration.py
          g++ -std=c++17 -Wall -Wextra -Werror -Itests/mockfs -Iinclude tests/test_rc5_3_5_fs_store.cpp -o /tmp/cielo_rc5_3_5_fs_store
          /tmp/cielo_rc5_3_5_fs_store
      - name: Instalar PlatformIO
        run: pip install platformio==6.1.18
      - name: Compilar ATOMS3 Lite
        run: pio run -e atoms3_lite_c124
      - name: Comprobar tamaño
        run: test -s .pio/build/atoms3_lite_c124/firmware.bin
      - name: Preparar archivo y huella
        run: |
          mkdir -p dist
          python tools/check_stack_build.py
          cp .pio/build/atoms3_lite_c124/firmware.bin dist/CIELO_11_1_CANDIDATO_SOLO_APLICACION.bin
          sha256sum dist/CIELO_11_1_CANDIDATO_SOLO_APLICACION.bin > dist/SHA256.txt
          cp dist/CIELO_11_1_CANDIDATO_SOLO_APLICACION.bin dist/IWAGUMI_CIELO_RC5_RECOVERY3_6_MANTENIMIENTO_CANDIDATO.bin
          cp partitions_8mb.csv dist/partitions_8mb.csv
          cp -R monitor docs dist/
          mkdir -p dist/tools dist/include
          cp tools/cielo_flash.py tools/cielo_spiffs.py tools/sign_firmware.py tools/update_observer.py dist/tools/
          cp include/cielo_ota_signing_public.h dist/include/
          python tools/package_manifest.py .pio/build/atoms3_lite_c124/firmware.bin dist/BUILD_MANIFEST.json
          cat dist/BUILD_MANIFEST.json
          git archive --format=zip --output=dist/CIELO_11_1_FUENTES_COMPLETAS.zip HEAD
          sha256sum dist/CIELO_11_1_FUENTES_COMPLETAS.zip >> dist/SHA256.txt
          printf '%s\n' "ATOMS3 Lite C124, fuente GitHub HEAD, firmware SOLO APLICACION, OTA LAN SIN CLAVE NI FIRMA OBLIGATORIA; BACKUP USB Y VALIDACION FISICA PENDIENTES" > dist/LEEME_RECUPERACION.txt
      - name: Publicar BIN candidato
        uses: actions/upload-artifact@v4
        with:
          name: CIELO_11_1_CANDIDATO_NO_INSTALAR_SIN_PRUEBAS
          path: dist/
          if-no-files-found: error
      - name: Guardar símbolos de depuración y mapa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CIELO_RC5_RECOVERY3_6_DEBUG_ELF_MAP
          path: |
            .pio/build/atoms3_lite_c124/firmware.elf
            .pio/build/atoms3_lite_c124/firmware.map
            dist/STACK_REPORT.json
          if-no-files-found: warn
