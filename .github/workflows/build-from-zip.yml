name: CIELO 9.6 - Compilar ZIP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CIELO_SOURCE.zip'
      - '.github/workflows/build-from-zip.yml'
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Comprobar y extraer codigo
        run: |
          test -f CIELO_SOURCE.zip
          mkdir -p build-src dist
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('CIELO_SOURCE.zip') as z:
              for info in z.infolist():
                  name = info.filename
                  if name.startswith('/') or '..' in name.split('/'):
                      raise ValueError('Ruta insegura: '+name)
              z.extractall('build-src')
          PY
      - name: Instalar compilador
        run: python -m pip install 'platformio==6.1.18'
      - name: Pruebas de fuentes
        working-directory: build-src
        run: python tools/validar_fuentes.py
      - name: Compilar ATOMS3 Lite
        working-directory: build-src
        run: pio run -e atoms3_lite_c124
      - name: Verificar y empaquetar firmware
        working-directory: build-src
        run: python .github/workflows/verificar_firmware.py
      - name: Entregar BIN compilado para revision (NO INSTALAR)
        uses: actions/upload-artifact@v4
        with:
          name: CIELO_96_R4_BIN_NO_INSTALAR
          path: |
            build-src/dist/**
            build-src/.pio/build/atoms3_lite_c124/firmware.elf
          if-no-files-found: error
      - name: Conservar registros si falla
        if: failure()
        run: echo 'Consultar la seccion del paso que ha fallado en Actions.'
