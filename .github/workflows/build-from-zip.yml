name: CIELO 9.6 | Compilar y registrar resultado
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev/r4-3-3-arranque-seguro]
    paths:
      - 'CIELO_SOURCE.zip'
      - 'src/**'
      - 'include/**'
      - 'tools/**'
      - 'web/**'
      - 'platformio.ini'
      - 'partitions_8mb.csv'
      - '.github/workflows/build-from-zip.yml'
permissions:
  contents: write
concurrency:
  group: cielo-zip-main
  cancel-in-progress: false
jobs:
  firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extraer fuente con rutas protegidas
        id: unpack
        shell: bash
        run: |
          set -euo pipefail
          test -s CIELO_SOURCE.zip
          mkdir -p build-src dist registros
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('CIELO_SOURCE.zip') as z:
              for i in z.infolist():
                  p=Path(i.filename)
                  if p.is_absolute() or '..' in p.parts or i.filename.startswith('/'):
                      raise ValueError('Ruta ZIP no segura')
              z.extractall('build-src')
          required=['platformio.ini','src/main.cpp','src/cielo_ble_worker.cpp',
                    'include/cielo_ble_queue.h','tools/validar_fuentes.py',
                    '.github/workflows/verificar_firmware.py']
          for n in required:
              if not (Path('build-src')/n).is_file():
                  raise FileNotFoundError(n)
          print('Fuente verificada y extraida')
          PY
      - name: Aplicar codigo fuente editable de GitHub
        shell: bash
        run: |
          set -euo pipefail
          for d in src include tests tools web reference; do
            if test -d "$d"; then
              mkdir -p "build-src/$d"
              cp -R "$d/." "build-src/$d/"
            fi
          done
          for f in platformio.ini partitions_8mb.csv; do
            if test -f "$f"; then cp "$f" "build-src/$f"; fi
          done
          echo 'Build sobre archivos fuente editables del repositorio, no sobre ZIP antiguo'
      - name: Generar interfaz C++ a partir del HTML unico
        run: python build-src/tools/generar_ui.py
      - name: Instalar PlatformIO
        id: install
        run: python -m pip install 'platformio==6.1.18'
      - name: Pruebas de logica
        id: tests
        working-directory: build-src
        shell: bash
        run: |
          set -o pipefail
          python tools/validar_fuentes.py 2>&1 | tee ../registros/pruebas.log
      - name: Compilar firmware ESP32-S3
        id: compile
        working-directory: build-src
        shell: bash
        run: |
          set -o pipefail
          pio run -e atoms3_lite_c124 2>&1 | tee ../registros/compilacion.log
      - name: Validar BIN de aplicacion
        id: verify
        working-directory: build-src
        run: python .github/workflows/verificar_firmware.py
      - name: Entregar BIN experimental si compila
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CIELO_96_R4_DEV_BIN_NO_INSTALAR
          path: |
            build-src/dist/**
            build-src/.pio/build/atoms3_lite_c124/firmware.elf
          if-no-files-found: error
          retention-days: 30
      - name: Guardar fuente completo independiente del BIN
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CIELO_96_CODIGO_FUENTE_AUDITABLE
          path: |
            build-src/src/
            build-src/include/
            build-src/web/
            build-src/reference/
            build-src/tests/
            build-src/tools/
            build-src/platformio.ini
            build-src/partitions_8mb.csv
            build-src/.github/workflows/verificar_firmware.py
          if-no-files-found: warn
          retention-days: 30
      - name: Conservar logs en Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CIELO_96_LOGS_COMPILACION
          path: registros/
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar resultado legible y codigo fuente en GitHub
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CI_FINAL_STATUS: ${{ job.status }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_COMMIT: ${{ github.sha }}
          CI_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,datetime,pathlib,hashlib
          p=pathlib.Path
          logs={}
          for name in ['pruebas','compilacion']:
              f=p('registros')/(name+'.log')
              logs[name]=f.read_text(errors='replace')[-14000:] if f.is_file() else 'NO SE EJECUTO'
          manifest=p('build-src/dist/MANIFIESTO_COMPILACION.json')
          m=json.loads(manifest.read_text()) if manifest.is_file() else None
          payload={'schema':'cielo-ci-report-v1',
                   'timestamp_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                   'status':os.environ['CI_FINAL_STATUS'],
                   'run_id':os.environ['CI_RUN_ID'],
                   'run_url':os.environ['CI_URL'],
                   'commit':os.environ['CI_COMMIT'],
                   'binary_manifest':m,
                   'source_sha256':hashlib.sha256(p('CIELO_SOURCE.zip').read_bytes()).hexdigest(),
                   'logs_tail':logs,
                   'note':'BIN DE DESARROLLO; NO INSTALAR SIN VALIDACION EN HARDWARE'}
          p('/tmp/cielo-ci-latest.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2))
          p('/tmp/cielo-ci-latest.md').write_text(
            '# CIELO 9.6 - Ultima compilacion\n\n'
            +'**Resultado:** '+payload['status']+'\n\n'
            +'**Ejecucion:** '+payload['run_url']+'\n\n'
            +'**BIN:** '+('Generado; NO INSTALAR' if m else 'No generado')+'\n\n'
            +'Ver latest.json para detalles y errores.\n')
          PY
          git fetch origin main
          git switch -C cielo-ci-report origin/main
          mkdir -p ci-results
          cp /tmp/cielo-ci-latest.json ci-results/latest.json
          cp /tmp/cielo-ci-latest.md ci-results/latest.md
          if test -f build-src/platformio.ini; then
            cp build-src/platformio.ini .
            cp build-src/partitions_8mb.csv .
            cp build-src/.gitignore .
            cp -R build-src/include build-src/src build-src/tests build-src/tools build-src/web build-src/reference .
            cp build-src/README.md README_SOURCE.md
            rm -f tests/test_codec_and_profile tests/test_ble_queue
          fi
          git add ci-results/latest.json ci-results/latest.md README_SOURCE.md
          git add platformio.ini partitions_8mb.csv .gitignore include/ src/ tests/ tools/ web/ reference/ || true
          if ! git diff --cached --quiet; then
            git config user.name 'CIELO CI'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'CI CIELO: informe de compilacion y copia legible del codigo fuente'
            git push origin HEAD:main
          fi
