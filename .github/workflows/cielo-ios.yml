name: CIELO · iPhone nativo
on:
  pull_request:
    branches: [dev/cielo-rc5-recovery3-12-diagnostics-20261031]
  workflow_dispatch:
concurrency:
  group: cielo-ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Registrar Xcode y generar proyecto
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          python3 ios/generate_project.py
          bash -n ios/archive_beta.sh
      - name: Comprobar contrato nativo sin hardware
        run: |
          swiftc ios/Cielo/Core.swift ios/Tests/CoreChecks.swift -o /tmp/cielo-core-check
          /tmp/cielo-core-check ios/Cielo/DemoProfile.json
      - name: Comprobar órdenes y errores con transporte simulado
        run: |
          swiftc -parse-as-library ios/Cielo/Core.swift ios/Cielo/Controller.swift ios/Tests/ControllerChecks.swift -o /tmp/cielo-controller-check
          /tmp/cielo-controller-check ios/Cielo/DemoProfile.json
      - name: Compilar para simulador
        run: xcodebuild -project ios/Cielo.xcodeproj -scheme CIELO -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/cielo-ios-simulator CODE_SIGNING_ALLOWED=NO build
      - name: Abrir demostración en simulador
        run: |
          mkdir -p dist
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["name"].startswith("iPhone")))')
          echo "CIELO_SIMULATOR_UDID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" /tmp/cielo-ios-simulator/Build/Products/Debug-iphonesimulator/CIELO.app
          xcrun simctl launch "$DEVICE" es.iwagumi.cielo
          sleep 4
          xcrun simctl io "$DEVICE" screenshot dist/CIELO_DEMO_SIMULADOR.png
      - name: Probar navegación y botones nativos
        run: |
          TEST_STATUS=0
          xcodebuild -project ios/Cielo.xcodeproj -scheme CIELO -configuration Debug -sdk iphonesimulator -destination "id=$CIELO_SIMULATOR_UDID" -parallel-testing-enabled NO -derivedDataPath /tmp/cielo-ios-simulator -resultBundlePath /tmp/cielo-ios-ui.xcresult CODE_SIGNING_ALLOWED=NO test || TEST_STATUS=$?
          if [ -d /tmp/cielo-ios-ui.xcresult ]; then
            xcrun xcresulttool export attachments --path /tmp/cielo-ios-ui.xcresult --output-path /tmp/cielo-ios-ui-attachments
            python3 ios/export_ui_evidence.py /tmp/cielo-ios-ui-attachments dist/CIELO_UI_CAPTURAS
            xcrun xcresulttool get test-results summary --path /tmp/cielo-ios-ui.xcresult > dist/CIELO_UI_RESUMEN.json
            ditto -c -k --keepParent /tmp/cielo-ios-ui.xcresult dist/CIELO_UI_RESULTADOS.zip
            ditto -c -k --keepParent dist/CIELO_UI_CAPTURAS dist/CIELO_UI_CAPTURAS.zip
          fi
          exit "$TEST_STATUS"
      - name: Abrir demostración en iPad
        run: |
          xcrun simctl shutdown "$CIELO_SIMULATOR_UDID"
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["name"].startswith("iPad")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" /tmp/cielo-ios-simulator/Build/Products/Debug-iphonesimulator/CIELO.app
          xcrun simctl launch "$DEVICE" es.iwagumi.cielo
          sleep 4
          xcrun simctl io "$DEVICE" screenshot dist/CIELO_DEMO_IPAD.png
      - name: Compilar iPhone sin firma
        run: xcodebuild -project ios/Cielo.xcodeproj -scheme CIELO -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath /tmp/cielo-ios-device CODE_SIGNING_ALLOWED=NO build
      - name: Empaquetar proyecto y apps sin firma
        run: |
          mkdir -p dist
          ditto -c -k --keepParent ios dist/CIELO_IOS_FUENTES.zip
          ditto -c -k --keepParent /tmp/cielo-ios-simulator/Build/Products/Debug-iphonesimulator/CIELO.app dist/CIELO_SIMULADOR.zip
          ditto -c -k --keepParent /tmp/cielo-ios-device/Build/Products/Release-iphoneos/CIELO.app dist/CIELO_IPHONE_SIN_FIRMA.zip
      - name: Registrar identidad y hashes de entrega
        env:
          CIELO_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 ios/build_manifest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CIELO_IOS_CANDIDATA_NO_PUBLICADA
          path: |
            dist/CIELO_*.zip
            dist/CIELO_*.png
            dist/CIELO_*.json
            dist/BUILD_MANIFEST.json
          if-no-files-found: error
