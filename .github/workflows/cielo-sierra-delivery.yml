name: CIELO · Sierra 4.0.2 entregas Telegram
on:
  push:
    branches: [dev/cielo-sierra-4-0-2-delivery-20261031]
  pull_request:
    branches: [dev/cielo-rc5-recovery3-12-diagnostics-20261031]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tests/test_sierra_observer.py
      - run: python tests/test_sierra_delivery.py
      - run: python tools/package_sierra.py
      - uses: actions/upload-artifact@v4
        with:
          name: CIELO_SIERRA_4_0_2_PY${{ matrix.python }}
          path: dist/CIELO_VIGILANCIA_iMAC_SIERRA_V4_0_2.zip
          if-no-files-found: error
